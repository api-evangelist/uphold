aid: uphold
name: Uphold
description: >-
  Uphold is a multi-asset digital money platform and regulated crypto exchange that lets consumers and
  businesses hold, trade, send and spend more than 300 cryptocurrencies, national currencies and precious
  metals from a single account. Its Enterprise API Suite ("Move on chain") is a modular set of OpenAPI
  3.1 REST APIs — Core, Widgets, Topper, Market Pulse and KYC Connector — that partners embed to onboard
  and KYC/KYB-verify users, move value across bank rails (ACH, FedNow/RTP, Wire, FPS, SEPA), debit and
  credit cards, alternative payment methods (Apple Pay, PayPal) and 50+ blockchain networks, and to run
  buy/sell, trade, send, portfolio, statements and FATF Travel Rule flows. Uphold also runs a public
  legacy market-data and wallet API at api.uphold.com/v0, publishes embeddable Payment, KYC and Travel
  Rule widgets, a Svix-backed webhook event surface, a full Sandbox with test helpers, a public Postman
  workspace, an llms.txt, an A2A agent card and a documentation MCP server.
image: https://cdn.prod.website-files.com/65116a8935747aeda81c6865/65a8ffa13ea101b31a905d2f_UPHOLD%20LOGO-2.png
url: https://raw.githubusercontent.com/api-evangelist/uphold/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.21'
created: '2026-08-05'
modified: '2026-08-05'
tags:
- Company
- cryptocurrency
- digital-assets
- payments
- banking
- fintech
- kyc
- compliance
- crypto-exchange
- market-data
- embedded-finance
- travel-rule
- webhooks
- agent-native
apis:
- name: Uphold Public API (v0)
  description: >-
    The long-standing public Uphold API at api.uphold.com/v0 — tickers and exchange rates, supported currencies
    and assets, plus OAuth 2.0 authenticated access to a member's cards, transactions and account data.
    Anonymous ticker and asset endpoints are open; documented in the uphold/docs GitHub repository.
  humanURL: https://uphold.com/developer/api/documentation/
  baseURL: https://api.uphold.com/v0
  tags:
  - market-data
  - cryptocurrency
  - digital-assets
  properties:
  - type: Documentation
    url: https://uphold.com/developer/api/documentation/
  - type: SourceCode
    url: https://github.com/uphold/docs
- name: Uphold Documentation MCP Server
  description: >-
    Anonymous, read-only Model Context Protocol server published by Uphold at developer.uphold.com/mcp
    over streamable HTTP. Exposes three tools (documentation search, a virtualized read-only docs filesystem
    query, and docs feedback submission) plus an MCP resource carrying the packaged "enterprise" agent
    skill.
  humanURL: https://developer.uphold.com/get-started/build-with-ai
  baseURL: https://developer.uphold.com/mcp
  tags:
  - agent-native
  - mcp
  properties:
  - type: MCPServer
    url: mcp/uphold-mcp.yml
  - type: ToolCrosswalk
    url: mcp/uphold-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.uphold.com/mcp
  - type: Documentation
    url: https://developer.uphold.com/get-started/build-with-ai
