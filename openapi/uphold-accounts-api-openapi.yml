  schemas:
    account-deposit-method:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/account-deposit-method-type'
          - description: The deposit method type.
        status:
          description: The status of the deposit method.
          type: string
          enum:
          - processing
          - ok
          - failed
        details:
          description: The details of the deposit method based on the type and network.
          oneOf:
          - title: Crypto
            $ref: '#/components/schemas/account-deposit-method-details-crypto'
          - title: Bank (FPS)
            $ref: '#/components/schemas/account-deposit-method-details-bank-fps'
          - title: Bank (SEPA)
            $ref: '#/components/schemas/account-deposit-method-details-bank-sepa'
          - title: Bank (US Rails)
            $ref: '#/components/schemas/account-deposit-method-details-bank-us-rails'
      required:
      - type
      - status
    account:
      type: object
      properties:
        id:
          description: The id of the account.
          type: string
          format: uuid
        ownerId:
          description: The id of the user that owns the account.
          type: string
          format: uuid
        label:
          description: The label of the account.
          type: string
        asset:
          description: The asset in which the account is denominated.
          type: string
        balance:
          description: The balance of the account.
          type: object
          properties:
            total:
              description: The total balance of the account.
              type: string
            available:
              description: The available balance of the account.
              type: string
          required:
          - total
          - available
        createdAt:
          description: The time at which the account was created.
          type: string
          format: date-time
        updatedAt:
          description: The last time at which the account was updated.
          type: string
          format: date-time
      required:
      - id
      - ownerId
      - label
      - asset
      - balance
      - createdAt
      - updatedAt
    account-label-for-request:
      allOf:
      - $ref: '#/components/schemas/string-no-edge-spaces'
      - type: string
        description: The label of the account.
        maxLength: 140
    string-no-edge-spaces:
      type: string
      pattern: ^\S.*\S$|^\S$
    simulate-bank-deposit-fednow-for-request:
      type: object
      additionalProperties: false
      properties:
        network:
          description: The network used to process the bank transfer.
          type: string
          enum:
          - fednow
        accountNumber:
          allOf:
          - $ref: '#/components/schemas/non-zero-account-number-us'
          - description: The account number of the destination bank account where funds will be deposited.
        amount:
          allOf:
          - $ref: '#/components/schemas/non-zero-decimal-amount'
          - description: The amount to be deposited into the destination account.
        remitter:
          description: The information about the external bank account holder who is sending the funds.
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The full name of the account holder sending the funds. Defaults to the authenticated user's name if not provided.
                type: string
                maxLength: 200
            accountNumber:
              allOf:
              - $ref: '#/components/schemas/non-zero-account-number-us'
              - description: The account number of the sender's bank account. A random value will be generated if not provided.
            routingNumber:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The nine-digit routing number of the sender's bank. A random value will be generated if not provided.
                type: string
                pattern: ^\d{9}$
      required:
      - network
      - accountNumber
      - amount
    simulate-bank-deposit-fps:
      type: object
      properties:
        network:
          description: The payment network used to process the simulated deposit.
          type: string
          enum:
          - fps
        sortCode:
          description: The sort code of the destination account that received the simulated deposit.
          type: string
        accountNumber:
          description: The account number of the destination account that received the simulated deposit.
          type: string
        asset:
          description: The asset of the simulated deposit transaction.
          type: string
        amount:
          description: The amount that was deposited in the simulation.
          type: string
        reference:
          description: The payment reference used for the simulated deposit, if one was provided.
          type: string
        remitter:
          description: The details of the simulated sender's bank account information.
          type: object
          properties:
            name:
              description: The full name of the simulated sender.
              type: string
            sortCode:
              description: The sort code of the simulated sender's bank branch.
              type: string
            accountNumber:
              description: The account number of the simulated sender's bank account.
              type: string
          required:
          - name
          - sortCode
          - accountNumber
      required:
      - network
      - sortCode
      - accountNumber
      - asset
      - amount
      - remitter
    simulate-bank-deposit-sepa-for-request:
      type: object
      properties:
        network:
          description: The network used to process the bank transfer.
          type: string
          enum:
          - sepa
        iban:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: The deposit destination virtual IBAN.
            type: string
            pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}([A-Z0-9]?){0,16}$
        asset:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: The bank account settlement asset.
        amount:
          allOf:
          - $ref: '#/components/schemas/non-zero-decimal-amount'
          - description: The amount to be deposited into the destination account.
        reference:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: 'A unique identifier indicating the specific account where the funds should be credited.

              If omitted, funds will be credited to the user''s default account.'
        remitter:
          description: Information about the bank deposit sender.
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The deposit sender's full name. Defaults to the authenticated user's name if not provided.
                type: string
                maxLength: 200
            bic:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The sender's bank BIC. A random value will be generated if not provided.
                type: string
                pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
            iban:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The sender's IBAN. A random value will be generated if not provided.
                type: string
                pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}([A-Z0-9]?){0,16}$
      required:
      - network
      - iban
      - asset
      - amount
    simulate-bank-deposit-fps-for-request:
      type: object
      properties:
        network:
          description: The network used to process the bank transfer.
          type: string
          enum:
          - fps
        sortCode:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: The six-digit sort code of the destination bank account where funds will be deposited.
            type: string
            pattern: ^\d{6}$
        accountNumber:
          allOf:
          - $ref: '#/components/schemas/non-zero-account-number-fps'
          - description: The account number of the destination bank account where funds will be deposited.
        asset:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: The user's account settlement asset.
        amount:
          allOf:
          - $ref: '#/components/schemas/non-zero-decimal-amount'
          - description: The amount to be deposited into the destination account.
        reference:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: 'A unique identifier indicating the specific account where the funds should be credited.

              If omitted, funds will be credited to the user''s default account.'
        remitter:
          description: Information about the bank deposit sender.
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The deposit sender's full name. Defaults to the authenticated user's name if not provided.
                type: string
                maxLength: 200
            sortCode:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The six-digit sort code of the sender's bank branch. A random value will be generated if not provided.
                type: string
                pattern: ^\d{6}$
            accountNumber:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The account number of the sender's bank account. A random value will be generated if not provided.
                type: string
                pattern: ^\d{8}$
      required:
      - network
      - sortCode
      - accountNumber
      - asset
      - amount
    simulate-bank-deposit-rtp:
      type: object
      properties:
        network:
          description: The payment network used to process the simulated deposit.
          type: string
          enum:
          - rtp
        accountNumber:
          description: The account number of the destination account that received the simulated deposit.
          type: string
        asset:
          description: The asset of the simulated deposit transaction.
          type: string
        amount:
          description: The amount that was deposited in the simulation.
          type: string
        remitter:
          description: The details of the simulated sender's bank account information.
          type: object
          properties:
            name:
              description: The full name of the simulated account holder who sent the funds.
              type: string
            accountNumber:
              description: The account number of the simulated sender's bank account.
              type: string
            routingNumber:
              description: The routing number of the simulated sender's bank.
              type: string
          required:
          - name
      required:
      - network
      - accountNumber
      - asset
      - amount
      - remitter
    simulate-bank-deposit-fednow:
      type: object
      properties:
        network:
          description: The payment network used to process the simulated deposit.
          type: string
          enum:
          - fednow
        accountNumber:
          description: The account number of the destination account that received the simulated deposit.
          type: string
        asset:
          description: The asset of the simulated deposit transaction.
