    simulate-bank-deposit-ach-for-request:
      type: object
      additionalProperties: false
      properties:
        network:
          description: The network used to process the bank transfer.
          type: string
          enum:
          - ach
        accountNumber:
          allOf:
          - $ref: '#/components/schemas/non-zero-account-number-us'
          - description: The account number of the destination bank account where funds will be deposited.
        routingNumber:
          allOf:
          - $ref: '#/components/schemas/string-no-edge-spaces'
          - description: The nine-digit routing number of the destination bank account.
            type: string
            pattern: ^\d{9}$
        amount:
          allOf:
          - $ref: '#/components/schemas/non-zero-decimal-amount'
          - description: The amount to be deposited into the destination account.
        remitter:
          description: The information about the external bank account holder who is sending the funds.
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The full name of the account holder sending the funds. Defaults to the authenticated user's name if not provided.
                type: string
                maxLength: 200
            accountNumber:
              allOf:
              - $ref: '#/components/schemas/non-zero-account-number-us'
              - description: The account number of the sender's bank account. A random value will be generated if not provided.
            routingNumber:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The nine-digit routing number of the sender's bank. A random value will be generated if not provided.
                type: string
                pattern: ^\d{9}$
            secCode:
              allOf:
              - $ref: '#/components/schemas/string-no-edge-spaces'
              - description: The SEC code for the ACH transaction. Defaults to WEB if not provided.
