- name: Uphold Enterprise Widgets API
  description: >-
    Session API behind the embeddable Uphold Widgets — creates Payment Widget, KYC Widget and Travel Rule
    Widget sessions that the browser/native SDKs consume to collect payment methods, KYC data and FATF
    Travel Rule information without the partner building the UI.
  humanURL: https://developer.uphold.com/widgets/introduction
  baseURL: https://api.enterprise.uphold.com
  tags:
  - payments
  - kyc
  - travel-rule
  - embedded-finance
  properties:
  - type: OpenAPI
    url: openapi/uphold-widgets-api-openapi.json
  - type: Documentation
    url: https://developer.uphold.com/widgets/introduction
  - type: Components
    url: components/uphold-components.yml
  - type: Overlay
    url: overlays/uphold-widgets-api-overlay.yaml
  - type: ChangeLog
    url: https://developer.uphold.com/widgets/changelog
- name: Uphold Market Pulse API
  description: >-
    Market data API returning descriptive asset information, real-time asset market statistics, per-asset
    news and general market news for the assets supported on the Uphold platform.
  humanURL: https://developer.uphold.com/rest-apis/market-pulse-api/assets/get-asset-information
  baseURL: https://api.enterprise.uphold.com
  tags:
  - market-data
  - cryptocurrency
  - digital-assets
  properties:
  - type: OpenAPI
    url: openapi/uphold-market-pulse-api-openapi.json
  - type: Documentation
    url: https://developer.uphold.com/rest-apis/market-pulse-api/assets/get-asset-information
  - type: Overlay
    url: overlays/uphold-market-pulse-api-overlay.yaml
- name: Uphold KYC Connector API
  description: >-
    Ingests verifications performed in third-party identity providers — Sumsub Reusable KYC and Veriff —
    and maps their payloads onto Uphold KYC processes, so a partner that already verifies users elsewhere
    does not have to re-verify them on Uphold.
  humanURL: https://developer.uphold.com/rest-apis/kyc-connector-api/introduction
  baseURL: https://api.enterprise.uphold.com
  tags:
  - kyc
  - compliance
  - identity
  properties:
  - type: OpenAPI
    url: openapi/uphold-kyc-connector-api-openapi.json
  - type: Documentation
    url: https://developer.uphold.com/rest-apis/kyc-connector-api/introduction
  - type: Overlay
    url: overlays/uphold-kyc-connector-api-overlay.yaml
- name: Uphold Topper API
  description: >-
    KYC-sharing API for Topper, Uphold's fiat-to-crypto onramp widget — identifies a user and creates a
    KYC sharing session so an existing Uphold verification can be reused inside a Topper integration.
  humanURL: https://developer.uphold.com/rest-apis/topper-api/kyc-sharing/create-session
  baseURL: https://api.enterprise.uphold.com
  tags:
  - kyc
  - payments
  - onramp
  properties:
  - type: OpenAPI
    url: openapi/uphold-topper-api-openapi.json
  - type: Documentation
    url: https://developer.uphold.com/rest-apis/topper-api/kyc-sharing/create-session
  - type: Overlay
    url: overlays/uphold-topper-api-overlay.yaml
- name: Uphold Public API (v0)
  description: >-
    The long-standing public Uphold API at api.uphold.com/v0 — tickers and exchange rates, supported
    currencies and assets, plus OAuth 2.0 authenticated access to a member's cards, transactions and
    account data. Anonymous ticker and asset endpoints are open; documented in the uphold/docs GitHub
    repository.
  humanURL: https://uphold.com/developer/api/documentation/
  baseURL: https://api.uphold.com/v0
  tags:
  - market-data
  - cryptocurrency
  - digital-assets
  properties:
  - type: Documentation
    url: https://uphold.com/developer/api/documentation/
  - type: SourceCode
    url: https://github.com/uphold/docs
- name: Uphold Documentation MCP Server
  description: >-
    Anonymous, read-only Model Context Protocol server published by Uphold at developer.uphold.com/mcp
    over streamable HTTP. Exposes three tools (documentation search, a virtualized read-only docs
    filesystem query, and docs feedback submission) plus an MCP resource carrying the packaged
    "enterprise" agent skill.
  humanURL: https://developer.uphold.com/get-started/build-with-ai
  baseURL: https://developer.uphold.com/mcp
  tags:
  - agent-native
  - mcp
  properties:
  - type: MCPServer
    url: mcp/uphold-mcp.yml
  - type: ToolCrosswalk
