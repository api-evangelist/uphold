note: >-
  Uphold's MCP server and its REST API are NOT projections of one core. The MCP server is a Mintlify
  documentation server: it searches and reads the published docs. The REST API moves money. The honest
  crosswalk is therefore almost entirely divergence — every MCP tool is mcp_only, and all 92 REST
  operations are rest_only. Recording this is the point: an agent that connects to Uphold's MCP server
  can read about how to onboard a user or send a payout, but cannot perform either through MCP. It must
  fall back to the OAuth2 client-credentials REST API, whose real input contracts are the parameters and
  requestBodies in the OpenAPI 3.1 specs harvested into openapi/.
