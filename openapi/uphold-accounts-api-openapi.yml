      examples:
        User Subdivision:
          value: US-CA
  requestBodies:
    simulate-crypto-deposit-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              network:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The crypto network used to process the simulated deposit.
              address:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The destination crypto address for the simulated deposit transaction.
              reference:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The destination additional identifier (e.g., destination tag, memo, or message) required for some networks such as XRP (Ripple), XLM (Stellar), EOS, and others.
              asset:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The asset of the simulated deposit transaction.
              amount:
                allOf:
                - $ref: '#/components/schemas/non-zero-decimal-amount'
                - description: The amount that was deposited in the simulation.
              remitter:
                description: The simulated sender's crypto account information.
                type: object
                additionalProperties: false
                minProperties: 1
                properties:
                  addresses:
                    description: The crypto addresses from which the simulated funds were sent.
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      $ref: '#/components/schemas/string-no-edge-spaces'
            required:
            - network
            - address
            - amount
            - asset
          examples:
            Simulate BTC Crypto Deposit:
              value:
                network: bitcoin
                address: tb1qjq4tvyjxkhpp0fp8lh8w3hhzwn4zue38hjjpkq
                asset: BTC
                amount: '0.001'
            Simulate BTC Crypto Deposit With Remitter Addresses:
              value:
                network: bitcoin
                address: tb1qjq4tvyjxkhpp0fp8lh8w3hhzwn4zue38hjjpkq
                asset: BTC
                amount: '0.001'
                remitter:
                  addresses:
                  - 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
                  - 3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy
            Simulate XLM Crypto Deposit:
              value:
                network: stellar
                address: GBPA3UQXMRWQALXUQBD66ZHX3Z7HQGHCTSMSNDHGRGHJPD7MYFGLYEC2
                asset: XLM
                amount: '10'
                reference: '67809592'
            Simulate XRP Crypto Deposit:
              value:
                network: xrp-ledger
                address: rfBtmHiLwwWH5maH2PT78GxubrSydRF9aY
                asset: XRP
                amount: '5'
                reference: '12345'
                remitter:
                  addresses:
                  - rD1syZmPdF6dRTpLfovfmiH4tMe56zxdYb
    create-account-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              label:
                $ref: '#/components/schemas/account-label-for-request'
              asset:
                description: The asset in which the account will be denominated.
                type: string
              metadata:
                description: Additional data for the account.
                $ref: '#/components/schemas/metadata'
            required:
            - label
            - asset
          examples:
            Create Account:
              value:
                label: My BTC account
                asset: BTC
                metadata:
                  externalId: 123
    update-account-request-body:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              label:
                $ref: '#/components/schemas/account-label-for-request'
          examples:
            Update Account:
              value:
                label: My BTC long-term
    simulate-bank-deposit-request-body:
      content:
        application/json:
          schema:
            type: object
            discriminator:
              propertyName: network
              mapping:
                fps: '#/components/schemas/simulate-bank-deposit-fps-for-request'
                sepa: '#/components/schemas/simulate-bank-deposit-sepa-for-request'
                ach: '#/components/schemas/simulate-bank-deposit-ach-for-request'
                fednow: '#/components/schemas/simulate-bank-deposit-fednow-for-request'
                rtp: '#/components/schemas/simulate-bank-deposit-rtp-for-request'
                wire: '#/components/schemas/simulate-bank-deposit-wire-for-request'
            oneOf:
            - title: FPS
              $ref: '#/components/schemas/simulate-bank-deposit-fps-for-request'
            - title: SEPA
              $ref: '#/components/schemas/simulate-bank-deposit-sepa-for-request'
            - title: ACH
              $ref: '#/components/schemas/simulate-bank-deposit-ach-for-request'
            - title: FedNow
              $ref: '#/components/schemas/simulate-bank-deposit-fednow-for-request'
            - title: RTP
              $ref: '#/components/schemas/simulate-bank-deposit-rtp-for-request'
            - title: Wire
              $ref: '#/components/schemas/simulate-bank-deposit-wire-for-request'
            required:
            - network
          examples:
            Simulate FPS Bank Deposit:
              value:
                network: fps
                sortCode: '123456'
                accountNumber: '12345678'
                reference: UH12345678
                asset: GBP
                amount: '100'
                remitter:
                  name: John Doe
                  sortCode: '654321'
                  accountNumber: '87654321'
            Simulate SEPA Bank Deposit:
              value:
                network: sepa
                iban: AT487954841229809844
                reference: UH12345678
                asset: EUR
                amount: '100'
                remitter:
                  name: John Doe
                  bic: LHVBEE22
                  iban: DE89370400440532013000
            Simulate ACH Bank Deposit:
              value:
                network: ach
                accountNumber: '378928485630'
                routingNumber: 021214891
                amount: '123'
                remitter:
                  name: John Doe
                  accountNumber: '987654321'
                  routingNumber: 021214891
                  secCode: CCD
                  transactionType: Push
                  serviceType: SameDay
            Simulate FedNow Bank Deposit:
              value:
                network: fednow
                accountNumber: '378928485630'
                amount: '150'
                remitter:
                  name: John Doe
                  accountNumber: '1234567890'
                  routingNumber: 026009593
            Simulate RTP Bank Deposit:
              value:
                network: rtp
                accountNumber: '378928485630'
                amount: '150'
                remitter:
                  name: John Doe
                  accountNumber: '1234567890'
                  routingNumber: 026009593
            Simulate Wire Bank Deposit:
              value:
                network: wire
                accountNumber: '378928485630'
                amount: '200'
                remitter:
                  name: John Doe
