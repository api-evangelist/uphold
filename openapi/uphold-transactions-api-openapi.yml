  requestBodies:
    update-transaction-request-for-information-request-body:
      content:
        application/json:
          schema:
            oneOf:
            - title: Travel Rule
              description: The Travel Rule data needed to resolve the RFI.
              type: object
              properties:
                data:
                  type: object
                  additionalProperties: true
                  minProperties: 1
              required:
              - data
          examples:
            Update Travel Rule Request for Information:
              value:
                data:
                  proof:
                    type: self-declaration
                    did: did:pkh:xrpl:0:rExampleAddress123456789
                    address: xrpl:0:rExampleAddress123456789
                    attestation: I hereby declare that the blockchain address rExampleAddress123456789 is under my own control and ownership.
                    confirmed: true
                    status: verified
                    txUpdate:
                      originatorProof:
                        type: self-declaration
                        did: did:pkh:xrpl:0:rExampleAddress123456789
                        address: xrpl:0:rExampleAddress123456789
                        attestation: I hereby declare that the blockchain address rExampleAddress123456789 is under my own control and ownership.
                        confirmed: true
                        status: verified
                      transactionAsset:
                        caip19: xrpl:0/slip44:144
                      transactionAmount: '4000000'
                      originatorEqualsBeneficiary: true
                      beneficiaryVASPdid: did:ethr:0xExampleVASPAddress000000000000000000000000
                      originatorVASPdid: did:pkh:xrpl:0:rExampleAddress123456789
                      beneficiary: {}
                      originator:
                        originatorPersons:
                        - naturalPerson:
                            name:
                              nameIdentifier:
                              - primaryIdentifier: Doe
                                secondaryIdentifier: John
                                nameIdentifierType: LEGL
                  errors: []
                  status: pending
                  valid: true
                  value:
                    amountDecimal: 4
                    asset: XRP-XRP
                    customer:
                      name: John Doe
                      type: natural
                    source:
                    - rExampleAddress123456789
                    agent:
                      type: WALLET
                      verified: true
                      did: did:pkh:xrpl:0:rExampleAddress123456789
                    counterparty:
                      name: John Doe
                      type: self
                      did: did:key:zExampleKeyDid123456789
                      verified: true
                    assetPrice:
                      price: 1.23
                      currency: USD
                  ivms101:
                    originator:
                      originatorPersons:
                      - naturalPerson:
                          name:
                            nameIdentifier:
                            - primaryIdentifier: Doe
                              secondaryIdentifier: John
                              nameIdentifierType: LEGL
    create-transaction-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              quoteId:
                description: The quote ID to commit.
                type: string
                format: uuid
              params:
                oneOf:
                - type: object
                  description: Additional parameters required to create the transaction.
                  properties:
                    travelRule:
                      description: The travel rule data needed to create the transaction.
                      type: object
                    requirements:
                      description: The requirements data needed to create the transaction.
                      type: array
                      items:
                        $ref: '#/components/schemas/create-transaction-requirement'
                    returnUrl:
                      description: The URL to redirect after the 3DS authorization flow. Deprecated in favor of `requirements`.
                      deprecated: true
                      type: string
                      format: uri
                      pattern: ^[a-zA-Z][a-zA-Z0-9+\-.]*:\/\/[^\s]+$
              metadata:
                description: Additional data for the transaction.
                $ref: '#/components/schemas/metadata'
            required:
            - quoteId
          examples:
            Create Transaction:
              value:
                quoteId: 623000c8-9bdf-4a2b-aa3d-6a6b44a7f6a0
                metadata:
                  externalId: 123
            Create Card Deposit Transaction:
              value:
                quoteId: 623000c8-9bdf-4a2b-aa3d-6a6b44a7f6a0
                params:
                  requirements:
                  - name: authorize:3ds
                    returnUrl: https://example.com/redirect
                metadata:
                  externalId: 123
    create-quote-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              origin:
                $ref: '#/components/schemas/create-quote-origin-node'
              destination:
                $ref: '#/components/schemas/create-quote-destination-node'
              denomination:
                type: object
                properties:
                  asset:
                    description: The asset in which the transaction is denominated.
                    type: string
                  amount:
                    allOf:
                    - $ref: '#/components/schemas/non-zero-decimal-amount'
                    - description: The amount of the transaction.
                  target:
                    description: Whether this exact amount should be paid by the origin or received by the destination.
                    type: string
                    enum:
                    - origin
                    - destination
                    default: origin
                required:
                - asset
                - amount
              ttl:
                description: The time-to-live for the quote in milliseconds.
                type: integer
                minimum: 1
            required:
            - origin
            - destination
            - denomination
          examples:
            Trade - Buy 100£ of BTC using GBP:
