components:
  requestBodies:
    update-kyc-crypto-risk-assessment-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              input:
                $ref: '#/components/schemas/kyc-process-input-form-for-request'
              output:
                description: Output of the KYC process.
                type: object
                properties:
                  result:
                    description: The result of the verification.
                    type: string
                    enum:
                    - approved
                    - rejected
                  attempts:
                    description: The attempts state of the verification.
                    type: object
                    properties:
                      used:
                        description: The number of attempts used. Default is 1.
                        type: integer
                        minimum: 1
                      maximum:
                        description: The maximum number of attempts allowed. Default is 5.
                        type: integer
                        minimum: 1
                    default:
                      used: 1
                      maximum: 5
                    required:
                    - used
                    - maximum
                  verifiedAt:
                    description: The date and time of the verification.
                    type: string
                    format: date-time
                required:
                - result
                - attempts
                - verifiedAt
            required:
            - input
          examples:
            Update Process - Uphold-verified:
              value:
                input:
                  formId: 7a0f4229-e3de-4dfd-8f91-9b1308b2dc33
                  answers:
                    decision-making:
                      who-makes-investment-decisions: i_decide
            Update Process - Partner-verified:
              value:
                input:
                  answers:
                    crypto-quiz:
                      decision-making: i_decide
                      loss-tolerance: full_loss_possible
                      volatility-understanding: highly_volatile
                      liquidity-awareness: may_be_delayed
                      regulatory-protection: no_coverage
                      portfolio-allocation: small_share
                      complexity-acknowledgement: complex_and_risky
                output:
                  result: approved
                  attempts:
                    used: 1
                    maximum: 5
                  verifiedAt: '2023-01-01T00:00:00.000Z'
    update-kyc-enhanced-due-diligence-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              input:
                description: Input of the KYC process.
                type: object
                properties:
                  media:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      properties:
                        context:
                          description: The context of the file.
                          type: string
                          enum:
                          - source-of-funds-proof
                        fileId:
                          description: The id of the file.
                          type: string
                          format: uuid
                      required:
                      - context
                      - fileId
                required:
                - media
              output:
                description: Output of the KYC process.
                type: object
                properties:
                  verifiedAt:
                    description: The date and time of the verification.
                    type: string
                    format: date-time
                required:
                - verifiedAt
            required:
            - input
          examples:
            Update Process - Partner-verified:
              value:
                input:
                  media:
                  - context: source-of-funds-proof
                    fileId: 57a3ecf2-5404-4654-9ece-feb504a69f86
                output:
                  verifiedAt: '2020-01-01T00:00:00.000Z'
    update-kyc-identity-request-body:
      content:
        application/json:
          schema:
            type: object
            discriminator:
              propertyName: type
              mapping:
                document-submission: '#/components/schemas/update-kyc-identity-document-submission'
                electronic-verification: '#/components/schemas/update-kyc-identity-electronic-verification'
            oneOf:
            - title: Document submission
              $ref: '#/components/schemas/update-kyc-identity-document-submission'
            - title: Electronic verification
              $ref: '#/components/schemas/update-kyc-identity-electronic-verification'
            required:
            - type
          examples:
            Update Process via Document Submission - Partner-verified:
              value:
                type: document-submission
                input:
                  media:
                  - context: photo-selfie
                    fileId: 470b2192-893f-4ce6-9daa-816d4c319a84
                output:
                  provider: veriff
                  document:
                    type: passport
                    number: 7700225VH
                    country: GB
                    expiresAt: '2026-03-13'
                  person:
                    givenName: John
                    familyName: Doe
                    birthdate: '1987-01-01'
                    gender: male
                  verifiedAt: '2020-01-01T00:00:00.000Z'
            Update Process via Electronic Verification - Partner-verified:
              value:
                type: electronic-verification
                input:
                  data:
                    givenName: John
                    familyName: Doe
                    birthdate: '1987-01-01'
                    citizenshipCountry: GB
                    address:
                      country: GB
                      city: Manchester
                      line1: 1 High Street
                      postalCode: M4 1AA
                output:
                  provider: onfido
                  verifiedAt: '2020-01-01T00:00:00.000Z'
    update-kyc-tax-details-request-body:
      content:
        application/json:
          schema:
            title: Dynamic Form
            description: Dynamic form input following the [JSON Forms](https://jsonforms.io/) specification, enabling progressive disclosure of properties and anytime submissions to keep tax details up to date.
            type: object
            properties:
              input:
                type: object
                additionalProperties: true
                minProperties: 1
                maxProperties: 1
              output:
                $ref: '#/components/schemas/update-kyc-tax-details-request-body-output'
            required:
            - input
          examples:
            Update Process - Uphold-verified:
              value:
                input:
                  taxResidency:
                    countries:
                    - GB
    update-kyc-self-categorization-statement-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              input:
                $ref: '#/components/schemas/kyc-process-input-form-for-request'
              output:
                description: Output of the KYC process.
                type: object
                properties:
                  result:
                    description: The result of the verification.
                    type: string
                    enum:
                    - approved
                    - rejected
                  attempts:
                    description: The attempts state of the verification.
                    type: object
                    properties:
                      used:
                        description: The number of attempts used. Default is 1.
                        type: integer
                        minimum: 1
                      maximum:
                        description: The maximum number of attempts allowed. Default is 30.
                        type: integer
                        minimum: 1
                    default:
                      used: 1
                      maximum: 30
                    required:
                    - used
                    - maximum
                  expiresAt:
                    description: The date and time when the verification expires.
                    type: string
                    format: date-time
                  verifiedAt:
                    description: The date and time of the verification.
                    type: string
                    format: date-time
                required:
                - result
                - attempts
                - expiresAt
                - verifiedAt
            required:
            - input
          examples:
            Update Process - Uphold-verified:
              value:
                input:
                  formId: ac33651f-f2d3-47c4-8e8d-06fb87361f5c
                  answers:
                    investor:
                      type: restricted_investor
            Update Process - Partner-verified:
              value:
                input:
                  answers:
                    investor-category:
                      type: high_net_worth_investor
                      annual-income-above-100000: 'yes'
                      annual-income: 120000
                      net-assets-above-250000: 'yes'
                      net-assets: 255000
                output:
                  result: approved
                  attempts:
                    used: 1
                    maximum: 30
                  expiresAt: '2026-01-01T00:00:00.000Z'
                  verifiedAt: '2023-01-01T00:00:00.000Z'
