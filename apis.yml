aid: uphold
name: Uphold
description: >-
  Uphold is a multi-asset digital money platform and regulated crypto exchange that lets consumers and
  businesses hold, trade, send and spend more than 300 cryptocurrencies, national currencies and precious
  metals from a single account. Its Enterprise API Suite ("Move on chain") is a modular set of OpenAPI
  3.1 REST APIs — Core, Widgets, Topper, Market Pulse and KYC Connector — that partners embed to onboard
  and KYC/KYB-verify users, move value across bank rails (ACH, FedNow/RTP, Wire, FPS, SEPA), debit and
  credit cards, alternative payment methods (Apple Pay, PayPal) and 50+ blockchain networks, and to run
  buy/sell, trade, send, portfolio, statements and FATF Travel Rule flows. Uphold also runs a public
  legacy market-data and wallet API at api.uphold.com/v0, publishes embeddable Payment, KYC and Travel
  Rule widgets, a Svix-backed webhook event surface, a full Sandbox with test helpers, a public Postman
  workspace, an llms.txt, an A2A agent card and a documentation MCP server.
