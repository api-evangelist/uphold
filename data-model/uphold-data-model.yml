polymorphic_nodes:
  note: >-
    The origin/destination of a quote or transaction is a NODE, and the node type is what makes the
    money-movement model general. Four node kinds exist.
  kinds:
  - {schema: transaction-node-account, meaning: an Uphold account (internal leg)}
  - {schema: transaction-node-external-account, meaning: a linked bank account, card or APM}
  - {schema: transaction-node-crypto-address, meaning: an on-chain address, with an execution mode of
      onchain, offchain or simulated}
  - {schema: transaction-node-apm, meaning: an alternative payment method (Apple Pay, PayPal/Venmo)}
