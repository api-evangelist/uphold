    validate-network-address-response:
      description: Address validation result.
      content:
        application/json:
          schema:
            type: object
            properties:
              isValid:
                description: Whether the address is valid for the specified network.
                type: boolean
              error:
                description: The error details if the address is invalid.
                type: object
                properties:
                  code:
                    description: The error code.
                    type: string
                    enum:
                    - address_invalid
                    - reference_invalid
                    - reference_missing
                  message:
                    description: A human-readable error message.
                    type: string
                  details:
                    description: Additional details about the error.
                    type: object
                    additionalProperties: true
                required:
                - code
                - message
            required:
            - isValid
          examples:
            Valid Address:
              value:
                isValid: true
            Invalid Address:
              value:
                isValid: false
                error:
                  code: address_invalid
                  message: The address is invalid
            Invalid Stellar Memo:
              value:
                isValid: false
                error:
                  code: reference_invalid
                  message: Stellar memo must be 28 bytes long
                  details:
                    rule: byteLength
                    expected: 28
                    actual: 10
            Invalid XRP Destination Tag:
              value:
                isValid: false
                error:
                  code: reference_invalid
                  message: XRP destination tag must be an integer between 0 and 4294967295
                  details:
                    rule: range
                    min: 0
                    max: 4294967295
            Missing Reference:
              value:
                isValid: false
                error:
                  code: reference_missing
                  message: A reference is required for this address
                  details:
                    rule: required
      headers:
        x-uphold-request-id:
          description: A unique identifier for the request that can be shared with Uphold for troubleshooting purposes.
          required: true
          schema:
            type: string
            format: uuid
          examples:
            Request ID:
              value: 9092ee4d-f0fb-42e9-8787-b668dbcec531
