  schemas:
    string-no-edge-spaces:
      type: string
      pattern: ^\S.*\S$|^\S$
    asset-type:
      description: The type of the asset.
      type: string
      enum:
      - fiat
      - crypto
    network-base:
      type: object
      properties:
        code:
          description: The unique code of the network.
          type: string
        name:
          description: The name of the network.
          type: string
        type:
          $ref: '#/components/schemas/network-type'
        logo:
          description: The logo of the network.
          type: string
          format: url
      required:
      - code
      - name
      - type
    network:
      type: object
      discriminator:
        propertyName: type
        mapping:
          crypto: '#/components/schemas/network-crypto'
          card: '#/components/schemas/network-card'
          bank: '#/components/schemas/network-bank'
          apm: '#/components/schemas/network-apm'
      oneOf:
      - title: Crypto
        $ref: '#/components/schemas/network-crypto'
      - title: Card
        $ref: '#/components/schemas/network-card'
      - title: Bank
        $ref: '#/components/schemas/network-bank'
      - title: Alternative payment method
        $ref: '#/components/schemas/network-apm'
    asset:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/asset-type'
        code:
          description: The unique code of the asset.
          type: string
        name:
          description: The name of the asset.
          type: string
        symbol:
          description: The symbol of the asset.
          type: string
        decimals:
          description: The maximum number of decimal places this asset can have.
          type: integer
          minimum: 0
        logo:
          description: The logo of the asset.
          type: string
          format: url
        features:
          description: The features of the asset.
          type: array
          items:
            $ref: '#/components/schemas/asset-features'
        cooldowns:
          description: The cooldowns of the asset.
          type: array
          items:
            type: object
            properties:
              rule:
                description: The cooldown rule.
                type: string
                enum:
                - financial-promotions
              features:
                description: The features affected by the cooldown.
                type: array
                items:
                  $ref: '#/components/schemas/asset-features'
              endsAt:
                description: The date and time when the cooldown ends.
                type: string
                format: date-time
      required:
      - code
      - name
      - type
      - decimals
      - cooldowns
      - features
    rail-method:
      type: string
      enum:
      - crypto-transaction
      - credit-card
      - debit-card
      - bank-transfer
      - apple-pay
      - paypal
      - venmo
    network-type:
      description: The type of the network.
      type: string
      enum:
      - crypto
      - card
      - bank
      - apm
    rail-apm:
      type: object
      allOf:
      - $ref: '#/components/schemas/rail-base'
      - type: object
        properties:
          type:
            enum:
            - apm
          method:
            enum:
            - apple-pay
            - paypal
            - venmo
    subdivision-code-for-request:
      type: string
      pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
    country-code-for-request:
      type: string
      pattern: ^[A-Z]{2}$
    feedback:
      description: A feedback message with a code and human-readable description.
      type: object
      properties:
        code:
          description: A short string with a brief explanation about the code reported.
          type: string
        message:
          description: A human-readable message providing more details.
          type: string
        details:
          description: Additional information about the feedback reported.
          type: object
          additionalProperties: true
      required:
      - code
      - message
    rail-type:
      type: string
      enum:
      - crypto
      - card
      - bank
      - apm
    news-item:
      type: object
      properties:
        title:
          description: The title of the news article.
          type: string
        publishedAt:
          description: The publication date and time of the news article.
          type: string
          format: date-time
        source:
          description: The source of the news article.
          type: string
        url:
          description: The URL to the full news article.
          type: string
          format: uri
    assets-cooldown-webhook-event:
      allOf:
      - $ref: '#/components/schemas/webhook-event'
      - type: object
        properties:
          data:
            type: object
            properties:
              userId:
                description: The id of the user.
                type: string
                format: uuid
              assets:
                description: The list of asset codes affected by the cooldown ending.
                type: array
                items:
                  type: string
              cooldown:
                type: object
                properties:
                  rule:
                    description: The cooldown rule.
                    type: string
                    enum:
                    - financial-promotions
                  features:
                    description: The features affected by the cooldown.
                    type: array
                    items:
                      type: string
                      enum:
                      - buy
                      - deposit
                  endsAt:
                    description: The date and time when the cooldown ended.
                    type: string
                    format: date-time
                required:
                - rule
                - features
                - endsAt
            required:
            - userId
            - assets
            - cooldown
    asset-historical-rate:
      type: object
      properties:
        rate:
          allOf:
          - $ref: '#/components/schemas/asset-rate'
          - description: 'The rate of the asset at the given timestamp.


              This field will be absent if the rate is not available for the given timestamp, which can happen if the asset was not available at that time.'
        timestamp:
          description: The timestamp of the rate.
          type: string
          format: date-time
      required:
      - timestamp
    error:
      description: The error information.
      allOf:
      - $ref: '#/components/schemas/feedback'
    rail-crypto:
      type: object
      allOf:
      - $ref: '#/components/schemas/rail-base'
      - type: object
        properties:
          type:
            enum:
            - crypto
          method:
            enum:
            - crypto-transaction
          contractAddress:
            description: The contract address for the asset within the network.
            type: string
    asset-information:
      description: Descriptive information about the asset.
      type: string
    rail-bank-constraint-allowed-deposit-accounts:
      type: object
      properties:
        rule:
          type: string
          enum:
          - allowed-deposit-accounts
        allowed:
          type: string
          enum:
          - default-only
      required:
      - rule
      - allowed
    webhook-event:
      description: The webhook event information.
      type: object
      properties:
        id:
          description: The id of the event.
          type: string
          format: uuid
        type:
          description: The type of event.
          type: string
        createdAt:
          description: The date and time when the event was created.
          type: string
          format: date-time
        data:
          description: The event payload.
          type: object
      required:
      - id
      - type
      - createdAt
      - data
    network-bank:
      allOf:
      - $ref: '#/components/schemas/network-base'
      - type: object
        properties:
          type:
            enum:
            - bank
          reference:
            description: The reference used for the network, if any.
            type: object
            properties:
              type:
                description: The type of reference.
                type: string
                enum:
                - payment-reference
            required:
            - type
    asset-information-response:
      type: object
      properties:
        information:
          $ref: '#/components/schemas/asset-information'
      required:
      - information
    rail-bank:
      type: object
      allOf:
      - $ref: '#/components/schemas/rail-base'
      - type: object
        properties:
          type:
            enum:
            - bank
          method:
            enum:
            - bank-transfer
          constraints:
            description: The constraints for the rail.
            type: array
            items:
              $ref: '#/components/schemas/rail-bank-constraint'
    rail-bank-constraint:
      oneOf:
      - $ref: '#/components/schemas/rail-bank-constraint-allowed-deposit-accounts'
      discriminator:
        propertyName: rule
        mapping:
          allowed-deposit-accounts: '#/components/schemas/rail-bank-constraint-allowed-deposit-accounts'
    rail:
      type: object
      discriminator:
        propertyName: type
        mapping:
          crypto: '#/components/schemas/rail-crypto'
          card: '#/components/schemas/rail-card'
          bank: '#/components/schemas/rail-bank'
          apm: '#/components/schemas/rail-apm'
      oneOf:
      - title: Crypto
        $ref: '#/components/schemas/rail-crypto'
      - title: Card
        $ref: '#/components/schemas/rail-card'
      - title: Bank
        $ref: '#/components/schemas/rail-bank'
      - title: Alternative payment method
        $ref: '#/components/schemas/rail-apm'
    rail-card:
      type: object
      allOf:
      - $ref: '#/components/schemas/rail-base'
      - type: object
        properties:
          type:
            enum:
            - card
          method:
            enum:
            - credit-card
            - debit-card
    network-apm:
      allOf:
      - $ref: '#/components/schemas/network-base'
      - type: object
        properties:
          type:
            enum:
            - apm
    asset-statistics:
      type: object
      properties:
        circulatingSupply:
          description: The asset's circulating supply.
          type: number
        marketCap:
          description: The asset's market capitalization.
          type: number
        volume24h:
          description: The asset's trading volume in the last 24 hours.
          type: number
        allTimeHigh:
          description: The asset's all-time high valuation in USD.
          type: number
      required:
      - circulatingSupply
      - marketCap
      - volume24h
      - allTimeHigh
    network-card:
      allOf:
      - $ref: '#/components/schemas/network-base'
      - type: object
        properties:
          type:
            enum:
            - card
    rail-base:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/rail-type'
          - description: The type of the rail.
        network:
          description: The network code of the rail.
          type: string
        method:
          allOf:
          - $ref: '#/components/schemas/rail-method'
          - description: The method through which operations are carried over the network.
        asset:
          description: The asset code of the rail.
          type: string
        decimals:
          description: The number of decimal places for the asset within the network.
          type: integer
          minimum: 0
        features:
          description: The features of the asset within the network.
          type: array
          items:
            type: string
            enum:
            - withdraw
            - deposit
      required:
      - type
      - network
      - method
      - asset
      - decimals
      - features
    asset-features:
      type: string
      enum:
      - buy
      - sell
      - transfer
      - withdraw
      - deposit
    asset-rate:
      type: object
      properties:
        bid:
          description: Highest price a buyer is willing to pay.
          type: string
        ask:
          description: Lowest price a seller is willing to accept.
          type: string
        mid:
          description: The mid price between the bid and ask.
          type: string
      required:
      - mid
    network-crypto:
      allOf:
      - $ref: '#/components/schemas/network-base'
      - type: object
        properties:
          type:
            enum:
            - crypto
          exampleAddress:
            description: An example address for the network.
            type: string
          reference:
            description: The reference used for the network, if any.
            type: object
            properties:
              type:
                description: The type of reference.
                type: string
                enum:
                - destination-tag
                - memo
            required:
            - type
          explorer:
            description: Details for exploring the blockchain.
            type: object
            properties:
              addressUrl:
                description: The URL to view address details.
                type: string
              txUrl:
                description: The URL to view transaction details.
                type: string
  requestBodies:
    validate-network-address-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              address:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The crypto address to validate.
              reference:
                allOf:
                - $ref: '#/components/schemas/string-no-edge-spaces'
                - description: The destination reference (for networks that support it, e.g., XRP destination tag).
            required:
            - address
          examples:
            Validate Bitcoin Address:
              value:
                address: tb1qgu0gacn9pqpnvlqclvdwyz4gfgxz8pptfz4emt
            Validate XRP Address With Reference:
              value:
                address: rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh
                reference: '12345'
    get-many-assets-request-body:
      content:
        application/json:
          schema:
            type: object
            properties:
              codes:
                description: The asset codes to retrieve.
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
            required:
            - codes
          examples:
            Get Many Assets:
              value:
                codes:
                - BTC
                - ETH
