            accountNumber:
              description: The account number of the simulated sender's bank account.
              type: string
            routingNumber:
              description: The routing number of the simulated sender's bank.
              type: string
          required:
          - name
      required:
      - network
      - accountNumber
      - asset
      - amount
      - remitter
