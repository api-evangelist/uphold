apis:
- name: Uphold Enterprise Core API
  description: >-
    The primary Uphold Enterprise REST API — users, KYC/KYB processes, capabilities, terms of service,
    files, countries, assets, networks and rails, accounts, external accounts (bank/card/APM), quotes and
    transactions, requests for information, portfolio, statements, metadata and webhook management.
    OAuth 2.0 client-credentials with fine-grained scopes; Sandbox test helpers simulate deposits,
    withdrawals and compliance state changes.
  humanURL: https://developer.uphold.com/rest-apis/core-api/concepts
  baseURL: https://api.enterprise.uphold.com
  tags:
