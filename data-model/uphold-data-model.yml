- name: country
  description: A supported country, with its asset availability and KYC requirements.
  schema: country
  key: code
  operations: [core.list-countries, core.get-country]
- name: terms-of-service
  description: A versioned agreement the user must accept before transacting, addressed by code.
  schema: terms-of-service
  key: code
